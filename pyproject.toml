[project]
name = "ai-career-intelligence-platform"
version = "0.3.0"
description = "Engineering-first AI career and internship intelligence platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "supabase>=2.18,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on syntax/import/runtime-safe baseline checks while the legacy
# codebase is incrementally modernized. New code should still follow project style.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]
