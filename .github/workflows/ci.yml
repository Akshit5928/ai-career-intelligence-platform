name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install "fastapi>=0.115,<1.0" "uvicorn[standard]>=0.30,<1.0" "supabase>=2.18,<3.0"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<9" "ruff>=0.6,<1.0"
      - name: Lint
        run: ruff check backend tests
      - name: Test
        run: pytest
